<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Printable Marker</title>
  <style>
    body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #111; background: #fff; }
    .controls { padding: 16px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    .controls label { display: flex; gap: 6px; align-items: center; }
    input { width: 80px; font: inherit; padding: 4px 6px; }
    button { font: inherit; padding: 6px 14px; }
    .sheet { display: flex; flex-direction: column; align-items: center; padding: 16px; gap: 8px; }
    #marker svg { display: block; shape-rendering: crispEdges; }
    .caption { font-size: 12px; color: #555; }
    @media print { .controls { display: none; } @page { margin: 10mm; } }
  </style>
</head>
<body>
  <div class="controls">
    <label>Marker id <input id="id" type="number" min="0" max="249" value="0" /></label>
    <label>Black square (cm) <input id="size" type="number" min="3" max="30" step="0.5" value="10" /></label>
    <button onclick="print()">Print</button>
    <a id="open" href="./">Open AR with these settings</a>
  </div>
  <div class="sheet">
    <div id="marker"></div>
    <div class="caption" id="caption"></div>
  </div>
  <script type="module" src="/src/marker.js"></script>
</body>
</html>
